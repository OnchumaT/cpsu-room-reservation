<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPSU Room Reservation System</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="toast-wrap" id="toasts"></div>
<div class="modal-ov" id="modalOv" style="display:none" onclick="if(event.target===this)App.closeModal()">
  <div class="modal">
    <div class="modal-hd"><span class="modal-ti" id="mTitle"></span><button class="modal-x" onclick="App.closeModal()">✕</button></div>
    <div class="modal-bd" id="mBody"></div>
    <div class="modal-ft" id="mFoot"></div>
  </div>
</div>

<div id="loginScreen" style="display:none"></div>

<div class="app" id="appShell" style="display:none">
  <div class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="logo-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div class="logo-tx">CPSU Rooms<small>ภาควิชา CS · ศิลปากร</small></div>
    </div>
    <div class="sb-nav" id="sbNav"></div>
    <div class="sb-user" id="sbUser"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="tog" onclick="App.toggleSidebar()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></div>
      <div class="tb-title" id="tbTitle">แดชบอร์ด</div>
      <div class="tb-right">

        <div class="nb" onclick="App.navigate('notifications')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <div class="nb-dot" id="nbDot" style="display:none"></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;cursor:pointer" onclick="App.showAccountMenu()">
        <div style="text-align:right">
          <div style="font-size:10px;color:#4A4F7A;font-weight:500" id="topRoleLabel">อาจารย์</div>
        </div>
        <div class="av" id="avBtn"></div>
      </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
